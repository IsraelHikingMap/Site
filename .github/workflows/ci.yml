name: CI

# This workflow is triggered on every push.
# It runs the backend and frontend tests and uploads the coverage to Codecov.
# The web, Android and iOS end to end tests run after the build of each of them, see IsraelHiking.Web/e2e.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Read by the installer of maestro
  MAESTRO_VERSION: 2.12.1

jobs:
  backend-and-frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: IsraelHiking.Web/.nvmrc

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '11.0'

      - name: Run backend tests
        run: dotnet test Tests/IsraelHiking.API.Tests  --logger "junit;LogFilePath=test-result.xml" /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:Exclude="[IsraelHiking.Common]*"
      - name: Run frontend tests
        run: |
          cd IsraelHiking.Web
          npm ci
          npx playwright install --with-deps chromium
          npm run test-ci
      - name: Run lint
        run: |
          cd IsraelHiking.Web
          npx ng lint
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Run web end to end tests
        run: |
          cd IsraelHiking.Web
          npm run build:web-e2e
          npm run e2e:web
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
      - name: Upload web end to end results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-web
          path: ~/.maestro/tests
      - name: Codecov upload
        if: always()
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./Tests/IsraelHiking.API.Tests/coverage.info,./IsraelHiking.Web/coverage/lcov.info
        env:
          CODECOV_TOKEN: fc1bea1d-f43a-437e-84d3-baef07be7454
  
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: IsraelHiking.Web/.nvmrc

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            IsraelHiking.Web/android/**/*.gradle*
            IsraelHiking.Web/android/**/gradle-wrapper.properties

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: IsraelHiking.Web/android
          bundler-cache: true

      - name: Build UI and set version
        run: |
          cd IsraelHiking.Web
          npm ci
          npm run build:mobile -- --no-progress
          npx cap sync android
      - name: Build Android Release
        if: ${{ github.secret_source == 'Actions' }}
        run: |
          cd IsraelHiking.Web/android
          bundle exec fastlane build_aab
        env:
          STORE_PASSWORD: ${{ secrets.MAPEAK_STORE_PASSWORD }}
          PASSWORD: ${{ secrets.MAPEAK_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/IsraelHiking.Web/android/app/Mapeak.jks
      - name: Upload aab artifacts
        if: ${{ github.secret_source == 'Actions' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mapeak_signed_${{ needs.version.outputs.version_string }}.aab
          path: IsraelHiking.Web/android/app/build/outputs/bundle/release/app-release.aab
      - name: Build Android for end to end tests
        run: |
          cd IsraelHiking.Web
          npm run build:mobile-e2e
          npx cap copy android
          cd android
          bundle exec fastlane build_e2e
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android end to end tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install IsraelHiking.Web/android/app/build/outputs/apk/release/app-release.apk
            IsraelHiking.Web/e2e/settle-android-emulator.sh
            maestro test IsraelHiking.Web/e2e/mobile/flows/android.yaml
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
      - name: Upload android end to end results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-android
          path: ~/.maestro/tests

  build-docker: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Build Docker image
        run: |
          docker build . -t ghcr.io/israelhikingmap/website-mapeak

  build-ios:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: IsraelHiking.Web/.nvmrc

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: IsraelHiking.Web/ios/App
          bundler-cache: true

      - name: Set up Git to use PAT for private match repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.FASTLANE_MATCH_PAT }}@github.com/IsraelHikingMap/fastlane-match".insteadOf "https://github.com/IsraelHikingMap/fastlane-match"

      - name: Build UI
        run: |
          cd IsraelHiking.Web
          npm ci
          npm run build:mobile -- --no-progress
          npx cap sync ios

      - name: Restore Swift package cache
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: IsraelHiking.Web/ios/.spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('IsraelHiking.Web/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          cd IsraelHiking.Web/ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -clonedSourcePackagesDirPath ../.spm-cache

      - name: Verify the iOS lock file is up to date
        run: git diff --exit-code -- IsraelHiking.Web/ios

      - name: Save Swift package cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: IsraelHiking.Web/ios/.spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('IsraelHiking.Web/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build iOS with signing
        if: ${{ github.secret_source == 'Actions' }}
        run: |
          cd IsraelHiking.Web/ios/App
          bundle exec fastlane build_ios
        env:
          MATCH_PASSWORD: ${{ secrets.PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
      - name: Upload ipa artifacts
        if: ${{ github.secret_source == 'Actions' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mapeak_signed_${{ needs.version.outputs.version_string }}.ipa
          path: IsraelHiking.Web/ios/App/App.ipa

  ios-end-to-end-tests:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: IsraelHiking.Web/.nvmrc

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: IsraelHiking.Web/ios/App
          bundler-cache: true

      - name: Build UI
        run: |
          cd IsraelHiking.Web
          npm ci
          npm run build:mobile-e2e
          npx cap sync ios

      - name: Restore Swift package cache
        uses: actions/cache/restore@v6
        with:
          path: IsraelHiking.Web/ios/.spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('IsraelHiking.Web/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          cd IsraelHiking.Web/ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -clonedSourcePackagesDirPath ../.spm-cache

      - name: Build iOS for end to end tests
        run: |
          cd IsraelHiking.Web/ios/App
          bundle exec fastlane build_e2e
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Run iOS end to end tests
        timeout-minutes: 60
        run: |
          # The simulator of the runner sometimes gets stuck, so the tests get a second chance on a new one
          run_tests() {
            IsraelHiking.Web/e2e/start-ios-simulator.sh && maestro test IsraelHiking.Web/e2e/mobile/flows/ios.yaml
          }
          run_tests || run_tests
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
      - name: Upload ios end to end results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-ios
          path: ~/.maestro/tests
