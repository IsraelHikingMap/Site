# The route depends on the production routing server and on OSM, so nothing is expected of it beyond
# not being empty. Maestro can not read the file that is downloaded, so its content is not checked.
url: http://localhost:4173/map/13.00/31.7734/35.2106
---
- runFlow: ../common/start-at-location.yaml
- tapOn:
    id: "Edit Route"
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: "60%,40%"
      - tapOn:
          point: "65%,55%"
      - extendedWaitUntil:
          visible: '[^0-9]*[1-9][0-9.,]* (mi|km|ft|m)'
          timeout: 15000
- tapOn:
    id: "Private Routes"
- tapOn:
    id: "More.*"
- tapOn: ".*Export Route"
- tapOn: "GPX version 1.1.*"
