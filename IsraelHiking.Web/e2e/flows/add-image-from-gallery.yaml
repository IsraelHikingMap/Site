# An image from the native picker has to make it through the resize, EXIF included, into the point.
# The image has to be a jpeg with EXIF data, the code that reads it does not run for anything else.
# It also has to be as big as a photo: the loading screen of the Android plugin stays open when an image is
# ready before that screen is.
appId: com.mapeak
tags:
  - android
  - ios
---
# On iOS the image is added by start-ios-simulator.sh, adding it to a simulator that already runs the tests hangs
- runFlow:
    when:
      platform: Android
    commands:
      - addMedia:
          - image-with-exif.jpg
- runFlow: ../common/start-at-location.yaml
- runFlow: ../common/add-point.yaml
- tapOn: ". Gallery"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Photo taken on.*"
      - tapOn: "Add.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow Full Access"
          timeout: 120000
      - tapOn: "Allow Full Access"
      - extendedWaitUntil:
          visible: "Done"
          timeout: 120000
      - waitForAnimationToEnd
      # The picker does not expose its content, the latest image is the one the test added
      - tapOn:
          point: "16%,52%"
      - tapOn: "Done"
- runFlow: ../common/save-point-with-image.yaml
