# Deletes the point that is open, expects it to be gone from the map and leaves the editing of points.
appId: com.mapeak
env:
  POINT_ON_MAP: ".*My point.*"
---
- runFlow:
    file: tap-button.yaml
    env:
      BUTTON: "Delete Point"
- extendedWaitUntil:
    notVisible: ${POINT_ON_MAP}
    timeout: 10000
- runFlow:
    file: tap-button.yaml
    env:
      BUTTON: "Edit Point"
