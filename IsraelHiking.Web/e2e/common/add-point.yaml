# Adds a point with a title and saves it.
appId: com.mapeak
---
- runFlow:
    file: tap-button.yaml
    env:
      BUTTON: "Edit Point"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: "70%,40%"
          label: "Tap on the map to add a point"
      - extendedWaitUntil:
          visible: "Title"
          timeout: 10000
# The keyboard moves the title when it opens
- waitForAnimationToEnd
- tapOn: "Title"
- inputText: "My point"
- extendedWaitUntil:
    visible:
      text: "My point"
      above: "Description"
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# The keyboard covers the save button
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done"
- runFlow:
    file: tap-button.yaml
    env:
      BUTTON: "Save"
- extendedWaitUntil:
    notVisible: "Description"
    timeout: 10000
