appId: com.mapeak
---
- tapOn: "Edit Point"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: "70%,40%"
          label: "Tap on the map to add a point"
      - extendedWaitUntil:
          visible: "Title"
          timeout: 10000
# The keyboard moves the title when it opens
- waitForAnimationToEnd
- tapOn: "Title"
- inputText: "My point"
- extendedWaitUntil:
    visible:
      text: "My point"
      above: "Description"
    timeout: 10000
- hideKeyboard:
    optional: true
- tapOn: "Camera"
