# Starts a clean app on a known location. Permissions are left for the app to ask for and are granted
# here, since asking for them is where a wrong R8 configuration takes the app down.
appId: com.mapeak
env:
  ALLOW_LOCATION: "(While using the app|Allow While Using App)"
---
- setLocation:
    latitude: 31.7734
    longitude: 35.2106
# An emulator that has just booted may restart the Google services, which takes the apps that use them down.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: unset
      - extendedWaitUntil:
          visible: ${ALLOW_LOCATION}
          timeout: 60000
- tapOn: ${ALLOW_LOCATION}
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Next"
    timeout: 60000
# The version of a CI build is older than the one in the store
- tapOn:
    text: "No"
    optional: true
- repeat:
    times: 10
    while:
      notVisible: "Close"
    commands:
      - tapOn: "Next"
- tapOn: "Close"
# The map can be seen behind the introduction
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 30000
- extendedWaitUntil:
    visible: "Edit Point"
    timeout: 30000
- waitForAnimationToEnd
