<mat-expansion-panel [expanded]="getExpandState()" (opened)="expand()" (closed)="collapse()">
  <mat-expansion-panel-header>
    <mat-panel-title>{{resources.legendPoi}}</mat-panel-title>
    <button mat-icon-button (click)="toggleVisibility($event)" [attr.aria-label]="resources.legendPoi"
      analyticsOn="click" analyticsCategory="Layers" analyticsLabel="Toggle visibility of points of interest">
      <i class="fa" [ngClass]="isCategoryGroupVisible() ? 'icon-eye' : 'icon-eye-slash'"></i>
    </button>
  </mat-expansion-panel-header>
  <mat-chip-listbox multiple="true" [attr.aria-label]="resources.legendPoi">
    @for (category of categories; track category) {
    <mat-chip-option [selected]="isCategoryVisible(category)"
      (selectionChange)="$event.isUserInput && toggleCategory(category)" analyticsOn="click"
      analyticsCategory="Layers" analyticsLabel="Toggle category visibility {{category.name}}">
      <i class="fa me-1" [ngClass]="category.icon" [style.color]="category.color"></i>
      {{resources.translate(category.name)}}
    </mat-chip-option>
    }
  </mat-chip-listbox>
</mat-expansion-panel>
