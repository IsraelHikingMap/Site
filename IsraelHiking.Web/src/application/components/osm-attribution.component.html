<div class="rounded-full bg-surface/40 px-2 text-on-surface/70" dir="ltr">
    <a class="no-underline text-inherit text-xs" href="https://www.openstreetmap.org/copyright" target="_blank">©
        OpenStreetMap</a>
    @if (isSatelliteImageryShown()) {
    <a class="no-underline text-inherit text-xs mx-1" href="https://www.mapbox.com/about/maps/" target="_blank">©
        Mapbox</a>
    <a class="no-underline text-inherit text-xs" href="https://www.maxar.com/" target="_blank">© Maxar</a>
    }
    @if (!isMobile()) {
    <span class="mx-1 text-xs">|</span>
    <a class="no-underline text-inherit text-xs" [href]="getEditAddress()" [dir]="resources.direction"
        target="_blank">{{resources.editThisMap}}</a>
    }
</div>
