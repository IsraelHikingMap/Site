<div class="w-full h-screen relative" [dir]="resources.direction">
    <mgl-map [mapStyle]="offlineMapStyle" (mapClick)="onMapClick($event)" (mapLoad)="onMapLoad($event)"
        [attributionControl]="false">
        <auto-layer [layerData]="baseLayerData" [visible]="true" [isBaselayer]="true" [allowOffline]="false"
            [before]="resources.endOfBaseLayer">
        </auto-layer>
        <mgl-geojson-source id="download-tiles" [data]="downloadedTiles()">
        </mgl-geojson-source>
        <mgl-geojson-source id="currnet-location" [data]="currentLocation">
        </mgl-geojson-source>
        <mgl-layer id="download-tiles-border" type="line" source="download-tiles"
            [filter]="['!=', ['get', 'incompatible'], 'true']" [layout]="{
              'line-cap': 'round',
              'line-join': 'round'
          }" [paint]="{
              'line-color': ['get', 'color'],
              'line-width': 3
          }">
        </mgl-layer>
        <mgl-layer id="download-tiles-border-incompatible" type="line" source="download-tiles"
            [filter]="['==', ['get', 'incompatible'], 'true']" [layout]="{
              'line-cap': 'butt',
              'line-join': 'round'
          }" [paint]="{
              'line-color': ['get', 'color'],
              'line-width': 3,
              'line-dasharray': [2, 1]
          }">
        </mgl-layer>
        <mgl-layer id="download-tiles-text" type="symbol" source="download-tiles" [minzoom]="4" [layout]="{
              'text-field': ['get', 'label'],
              'text-font': ['Noto Sans Regular'],
              'text-size': ['get', 'textSize'],
          }" [paint]="{
              'text-color': ['get', 'color'],
              'text-halo-color' : 'white',
              'text-halo-width': 2
          }">
        </mgl-layer>
        <mgl-geojson-source id="selected-tile" [data]="selectedTile()">
        </mgl-geojson-source>
        <mgl-layer id="selected-tile-border" type="line" source="selected-tile" [layout]="{
              'line-cap': 'round', 
              'line-join': 'round'
          }" [paint]="{
              'line-color': 'green',
              'line-width': 3
          }">
        </mgl-layer>
        <mgl-layer id="currnet-location-circle" type="circle" source="currnet-location" [paint]="{
              'circle-radius': 7,
              'circle-color': 'magenta'

          }">
        </mgl-layer>
        <mgl-layer id="selected-tile-text" type="symbol" source="selected-tile" [minzoom]="4" [layout]="{
              'text-field': ['get', 'label'],
              'text-font': ['Noto Sans Regular'],
              'text-size': 30,
              'text-allow-overlap': true
          }" [paint]="{
              'text-color': 'green',
              'text-halo-color' : 'white',
              'text-halo-width': 2
          }">
        </mgl-layer>
        <mgl-geojson-source id="in-progress-tile" [data]="inProgressTile()">
        </mgl-geojson-source>
        <mgl-layer id="in-progress-tile-border" type="line" source="in-progress-tile" [layout]="{
              'line-cap': 'round', 
              'line-join': 'round'
          }" [paint]="{
              'line-color': 'blue',
              'line-width': 3
          }">
        </mgl-layer>
        <mgl-layer id="in-progress-tile-text" type="symbol" source="in-progress-tile" [minzoom]="4"
            [filter]="['==', ['get', 'stroke'], 'true']" [layout]="{
              'text-field': ['get', 'label'],
              'text-font': ['Noto Sans Regular'],
              'text-size': 30,
              'text-allow-overlap': true
          }" [paint]="{
              'text-color': 'blue',
              'text-halo-color' : 'white',
              'text-halo-width': 2
          }">
        </mgl-layer>
        <mgl-layer id="in-progress-tile-fill" type="fill" source="in-progress-tile"
            [filter]="['==', ['get', 'fill'], 'true']" [paint]="{
              'fill-color': 'rgba(0, 128, 128, 0.5)'
          }">
        </mgl-layer>
    </mgl-map>
</div>
<div class="absolute bottom-safe w-full text-lg text-center" [dir]="resources.direction">
    <div class="flex flex-row">
        @if (selectedTileXY() && !isSelectedAvailableForOffline() && !downloadingTile()) {
        <div class="flex-1 m-1">
            <button mat-flat-button class="w-full" (click)="downloadSelected()" analyticsOn="click"
                analyticsCategory="Offline Management" analyticsLabel="Download">
                <i class="fa fa-lg icon-download"></i>
                {{resources.startDownload}}
            </button>
        </div>
        }
        @if (selectedTileXY() && isSelectedAvailableForOffline() && !downloadingTile()) {
        <div class="flex-1 m-1">
            <button mat-flat-button class="w-full" (click)="downloadSelected()" analyticsOn="click"
                analyticsCategory="Offline Management"
                [analyticsLabel]="isSelectedIncompatible() ? 'Download Again' : 'Update'">
                <i class="fa fa-lg icon-download"></i>
                {{isSelectedIncompatible() ? resources.download : resources.update}}
            </button>
        </div>
        <div class="flex-1 m-1">
            <button mat-raised-button class="w-full error-button" (click)="deleteSelected()" analyticsOn="click"
                analyticsCategory="Offline Management" analyticsLabel="Delete">
                <i class="fa fa-lg icon-trash"></i>
                {{resources.delete}}
            </button>
        </div>
        }
        @if (downloadingTile()) {
        <div class="flex-1 m-1">
            <button mat-flat-button class="w-full" (click)="cancelDownload()" analyticsOn="click"
                analyticsCategory="Offline Management" analyticsLabel="Cancel">
                <i class="fa fa-lg icon-close"></i>
                {{resources.cancel}}
            </button>
        </div>
        }
    </div>
    @if (statusMessage()) {
    <div class="bg-surface p-2 flex flex-row items-center justify-center gap-2"
        [class.text-warning]="isStatusWarning()">
        @if (isStatusWarning()) {
        <i class="fa fa-lg icon-exclamation-triangle"></i>
        }
        <span>{{statusMessage()}}</span>
        @if (isStatusWarning()) {
        <button mat-button (click)="selectNextIncompatible()" analyticsOn="click"
            analyticsCategory="Offline Management" analyticsLabel="Next Incompatible">
            <i class="fa fa-lg" [class.icon-chevron-left]="resources.direction === 'rtl'"
                [class.icon-chevron-right]="resources.direction !== 'rtl'"></i>
            {{resources.next}}
        </button>
        }
    </div>
    }
</div>
