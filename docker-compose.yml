services:
#  website:
#    image: israel-hiking
#    build: .
#    environment:
#      - ASPNETCORE_ENVIRONMENT=Development
#    ports:
#      - "5000:5000"
#    volumes:
#      - ./IsraelHiking.Web/appsettings.json:/israelhiking/appsettings.json
#      # The Valhalla routing profiles - the keys are the profile names, "default" is used for any profile
#      # that is not listed, and "costingOptions" is sent to Valhalla as-is, see
#      # https://valhalla.github.io/valhalla/api/turn-by-turn/api-reference/#costing-options
#      # The file is read on startup, so restart the container after changing it.
#      - ./IsraelHiking.Web/valhalla-profiles.json:/israelhiking/valhalla-profiles.json
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.8
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - esdata:/usr/share/elasticsearch/data:rw
    ports:
      - 9200:9200
      - 9300:9300
    restart: always
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: valhalla
    # On first start the image downloads the OSM extract below and builds the routing tiles into
    # the named volume; later starts reuse them (set force_rebuild=True or run valhalla-update.sh
    # to refresh). The HTTP API (route, trace_route, ...) is served on port 8002.
    environment:
      - tile_urls=https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - server_threads=2
    volumes:
      - valhalladata:/custom_files
    ports:
      - 8002:8002
    restart: always
  gpsbabel:
    image: israelhikingmap/gpsbabelwebapi
    container_name: gpsbabel
    ports:
      - 11987:80
    restart: always
  translation:
    image: libretranslate/libretranslate
    container_name: translation
    volumes:
      - tldata:/home/libretranslate:rw
    ports:
      - 5432:5000
    restart: always
  user-data:
    image: ghcr.io/mapeak-com/user-data
    container_name: user-data
    ports:
      - 3000:3000
    restart: always
    environment:
      - ES_URL=http://elasticsearch:9200
      - IMGUR_CLIENT_ID=1234567890
    volumes:
      - ./partners.json:/app/partners.json
  nginx:
    image: nginxinc/nginx-unprivileged
    container_name: nginx
    ports:
      - "5001:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    restart: always
  tileserver-gl:
    image: "maptiler/tileserver-gl"
    build:
      context: https://github.com/maptiler/tileserver-gl.git#v5.6.0
    command:
      - --verbose
      - --config
      - tileserver-gl-config.json
    ports:
      - 11223:8080
    volumes:
      - ./tileserver-gl-config.json:/data/tileserver-gl-config.json:ro
  # Panoramax is the image host the site uploads points of interest pictures to, see PanoramaxGateway.
  # The API is at http://localhost:5555/api/ and the pictures can be browsed at http://localhost:3001
  # Uploading needs no token here since API_FORCE_AUTH_ON_UPLOAD is off, on a real instance the token
  # is taken from the PanoramaxToken setting.
  panoramax-db:
    image: postgis/postgis:16-3.4
    container_name: panoramax-db
    environment:
      - POSTGRES_DB=geovisio
      - POSTGRES_USER=gvs
      - POSTGRES_PASSWORD=gvspwd
    healthcheck:
      test: pg_isready -h localhost -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 5s
    volumes:
      - panoramaxdbdata:/var/lib/postgresql/data/
    restart: always
  panoramax-migrations:
    image: panoramax/api:latest
    container_name: panoramax-migrations
    command: db-upgrade
    environment:
      - DB_URL=postgres://gvs:gvspwd@panoramax-db/geovisio
    depends_on:
      panoramax-db:
        condition: service_healthy
  panoramax-api:
    image: panoramax/api:latest
    container_name: panoramax-api
    command: ssl-api
    environment:
      - DB_URL=postgres://gvs:gvspwd@panoramax-db/geovisio
      - FS_URL=/data/geovisio
      - API_FORCE_AUTH_ON_UPLOAD=False
      - API_PICTURES_LICENSE_SPDX_ID=CC0-1.0
      - API_PICTURES_LICENSE_URL=https://spdx.org/licenses/CC0-1.0.html
      - API_ACCEPT_DUPLICATE=True
      - PICTURE_PROCESS_DERIVATES_STRATEGY=PREPROCESS
      - PICTURE_PROCESS_THREADS_LIMIT=0
      - 'API_SUMMARY={"name":{"en":"Mapeak (local)"},"color":"#4c6c9c"}'
    ports:
      - 5555:5000
    volumes:
      - panoramaxdata:/data/geovisio
    depends_on:
      panoramax-db:
        condition: service_healthy
      panoramax-migrations:
        condition: service_completed_successfully
    restart: always
  # Generates the thumbnail and the standard definition version of every uploaded picture.
  # No blurring service is configured, so faces and plates are left as they are.
  panoramax-worker:
    image: panoramax/api:latest
    container_name: panoramax-worker
    command: picture-worker
    environment:
      - DB_URL=postgres://gvs:gvspwd@panoramax-db/geovisio
      - FS_URL=/data/geovisio
      - PICTURE_PROCESS_DERIVATES_STRATEGY=PREPROCESS
    volumes:
      - panoramaxdata:/data/geovisio
    depends_on:
      panoramax-db:
        condition: service_healthy
      panoramax-migrations:
        condition: service_completed_successfully
    restart: always
  panoramax-website:
    image: panoramax/website:latest
    container_name: panoramax-website
    environment:
      - VITE_API_URL=http://localhost:5555/
      - VITE_INSTANCE_NAME=Mapeak (local)
      - VITE_TILES=https://panoramax.openstreetmap.fr/pmtiles/basic.json
    ports:
      - 3001:3000
    restart: always
volumes:
  esdata:
    driver: local
  valhalladata:
    driver: local
  tldata:
    driver: local
  panoramaxdata:
    driver: local
  panoramaxdbdata:
    driver: local
