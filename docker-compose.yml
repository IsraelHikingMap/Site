services:
#  website:
#    image: israel-hiking
#    build: .
#    environment:
#      - ASPNETCORE_ENVIRONMENT=Development
#      # Where appsettings.json and nonPublic.json are read from, see the volume below
#      - CONFIG_FOLDER=config
#    ports:
#      - "5000:5000"
#    # The folder is mounted rather than the files inside it, so that replacing a file on the host - what
#    # "git pull", "cp" and most editors do - is picked up without recreating the container.
#    # The folder holds:
#    #   appsettings.json       - see ConfigurationData, and set "valhallaProfilesFilePath" in it to
#    #                            "config/valhalla-profiles.json" so the mounted profiles are the ones used
#    #   nonPublic.json         - the secrets, API keys and tokens, see NonPublicConfigurationData
#    #   valhalla-profiles.json - read again whenever it changes, the rest are only read on startup, so
#    #                            restart the container after changing them.
#    #                            The routing profiles, the keys are the profile names, "default" is used
#    #                            for any profile that is not listed, and "costingOptions" is sent to
#    #                            Valhalla as-is, see
#    #                            https://valhalla.github.io/valhalla/api/turn-by-turn/api-reference/#costing-options
#    volumes:
#      - ./config:/israelhiking/config:ro
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.8
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - esdata:/usr/share/elasticsearch/data:rw
    ports:
      - 9200:9200
      - 9300:9300
    restart: always
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: valhalla
    # On first start the image downloads the OSM extract below and builds the routing tiles into
    # the named volume; later starts reuse them (set force_rebuild=True or run valhalla-update.sh
    # to refresh). The HTTP API (route, trace_route, ...) is served on port 8002.
    environment:
      - tile_urls=https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - server_threads=2
    volumes:
      - valhalladata:/custom_files
    ports:
      - 8002:8002
    restart: always
  gpsbabel:
    image: israelhikingmap/gpsbabelwebapi
    container_name: gpsbabel
    ports:
      - 11987:80
    restart: always
  translation:
    image: ghcr.io/mapeak-com/translation:latest
    container_name: translation
    environment:
      - LTENGINE_MODEL=gemma3-12b
    volumes:
      - ltdata:/models
    ports:
      - 5432:5050
    restart: always
  user-data:
    image: ghcr.io/mapeak-com/user-data
    container_name: user-data
    ports:
      - 3000:3000
    restart: always
    environment:
      - ES_URL=http://elasticsearch:9200
      - IMGUR_CLIENT_ID=1234567890
    volumes:
      - ./partners.json:/app/partners.json
  nginx:
    image: nginxinc/nginx-unprivileged
    container_name: nginx
    ports:
      - "5001:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    restart: always
  tileserver-gl:
    image: "maptiler/tileserver-gl"
    build:
      context: https://github.com/maptiler/tileserver-gl.git#v5.6.0
    command:
      - --verbose
      - --config
      - tileserver-gl-config.json
    ports:
      - 11223:8080
    volumes:
      - ./tileserver-gl-config.json:/data/tileserver-gl-config.json:ro
  user-images:
    image: ghcr.io/mapeak-com/user-images
    container_name: user-images
    ports:
      - 3001:3000
    environment:
      - PUBLIC_BASE_URL=http://localhost:3001
      - STORAGE_DIR=/data/images
    volumes:
      - userimagesdata:/data/images
    restart: always
volumes:
  esdata:
    driver: local
  valhalladata:
    driver: local
  ltdata:
    driver: local
  userimagesdata:
    driver: local
